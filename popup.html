<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Limpar WhatsApp Web</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 260px;
      padding: 16px;
    }

    h1 {
      font-size: 16px;
      margin: 0 0 12px;
    }

    button {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 12px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>WhatsApp Web</h1>
  <button type="button" id="clearBtn">Limpar cache e dados</button>
  <div id="status" role="status" aria-live="polite"></div>

  <script src="popup.js"></script>
</body>
</html>
